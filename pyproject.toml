[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "databench"
dynamic = ["version"]
description = "Minimal, reproducible analysis/plotting toolkit for multiindex datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "loguru",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["databench*"]

[tool.setuptools_scm]
# Version is derived from git tags (e.g. `git tag v0.2.0`) and written to
# databench/_version.py at build / install time. Untagged commits get a
# dev version like `0.2.1.dev3+gC7461EA`. A dirty tree appends `.dXXXXXXXX`.
version_file = "databench/_version.py"
fallback_version = "0.0.0+unknown"
