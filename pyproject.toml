[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databench"
dynamic = ["version"]
description = "Minimal, reproducible analysis/plotting toolkit for multiindex datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru",
    "matplotlib",
    "mesokit-schema",
    "numpy",
    "pandas",
    "scipy",
]

[project.optional-dependencies]
duckdb = ["duckdb"]

[project.scripts]
databench-view = "databench.viewer:main"
databench-duckdb = "databench.duckdb_export:main"

[tool.setuptools.package-data]
"databench.viewer" = ["index.html"]

[tool.setuptools.packages.find]
where = ["."]
include = ["databench*"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
