[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "databench"
dynamic = ["version"]
description = "Minimal, reproducible analysis/plotting toolkit for multiindex datasets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "loguru",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["databench*"]

[tool.setuptools_scm]
write_to = "databench/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
